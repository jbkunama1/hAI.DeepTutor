services:
  deeptutor:
    image: ghcr.io/jbkunama1/hai.deeptutor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEB_PORT:-8042}:3782"
    volumes:
      - deeptutor-data:/app/data
    networks:
      - highfishNetwork
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Europe/Berlin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  deeptutor-data:
    name: hai-deeptutor-data
networks:
  highfishNetwork:
    external: true
    name: highfishNetwork
