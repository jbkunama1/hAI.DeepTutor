name: Build and publish DeepTutor
on:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'upstream.env']
  workflow_dispatch:
permissions:
  contents: write
  packages: write
concurrency:
  group: deeptutor-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/HKUDS/DeepTutor/releases/latest --jq .tag_name)
          sha=$(gh api "repos/HKUDS/DeepTutor/commits/$tag" --jq .sha)
          previous=$(jq -r '.sha // ""' .github/upstream-built.json 2>/dev/null || true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" != schedule || "$sha" != "$previous" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream: $tag / $sha; previous successful build: $previous" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: steps.upstream.outputs.build == 'true'
        with:
          repository: HKUDS/DeepTutor
          ref: ${{ steps.upstream.outputs.sha }}
          path: upstream
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
        if: steps.upstream.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.upstream.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish production image
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jbkunama1/hai.deeptutor:latest
            ghcr.io/jbkunama1/hai.deeptutor:upstream-${{ steps.upstream.outputs.sha }}-run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.DeepTutor
            org.opencontainers.image.revision=${{ steps.upstream.outputs.sha }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record successful upstream build
        if: steps.upstream.outputs.build == 'true'
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n --arg tag "$UPSTREAM_TAG" --arg sha "$UPSTREAM_SHA" --arg run "$GITHUB_RUN_ID" '{tag:$tag,sha:$sha,run:$run}' > /tmp/upstream-built.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          cp /tmp/upstream-built.json .github/upstream-built.json
          git add .github/upstream-built.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record successful upstream build $UPSTREAM_TAG"
            git push origin HEAD:main
          fi
