name: Build and publish DeepTutor
on:
  push:
    branches: [main]
    paths: ['.github/workflows/build.yml', 'upstream.env']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: deeptutor-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Read upstream version
        id: version
        shell: bash
        run: |
          source upstream.env
          echo "ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: HKUDS/DeepTutor
          ref: ${{ steps.version.outputs.ref }}
          path: upstream
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build production image from source and publish
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/jbkunama1/hai.deeptutor:latest
            ghcr.io/jbkunama1/hai.deeptutor:${{ steps.version.outputs.ref }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/jbkunama1/hAI.DeepTutor
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
